name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  release:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7 (7.0.1)
      
    - name: "Set up Python"
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7 (7.1.0)
      with:
        python-version-file: ".python-version"

    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10 (10.3.3)
      with:
        enable-cache: true

    - name: Build package
      run: |
        rm -rf dist/
        uv build

    - name: Publish package to PyPI
      env:
        UV_PUBLISH_TOKEN: '${{ secrets.PYPI_TOKEN_ANLS_STAR }}'
      run: |
        uv publish
