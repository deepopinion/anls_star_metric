version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "[CI] dependabot:"
      
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "[BUILD] dependabot:"
    groups:
      uv-development:
        dependency-type: development
        exclude-patterns:
          - "uv-build"  # grouped, its update is skipped since uv.lock has no previous version for it
      uv-production:
        dependency-type: production
